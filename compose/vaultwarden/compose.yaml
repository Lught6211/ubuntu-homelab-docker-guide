services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "false"
    volumes:
      - vaultwarden_data:/data
    networks:
      - homelab_proxy

volumes:
  vaultwarden_data:

networks:
  homelab_proxy:
    external: true
    name: homelab_proxy

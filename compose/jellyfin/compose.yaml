services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${JELLYFIN_MEDIA_PATH:-/srv/media}:/media:ro

volumes:
  jellyfin_config:
  jellyfin_cache:

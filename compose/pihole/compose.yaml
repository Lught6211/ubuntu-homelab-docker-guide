services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      FTLCONF_LOCAL_IPV4: "${PIHOLE_IPV4:?Set PIHOLE_IPV4 in your environment}"
    volumes:
      - ./etc-pihole:/etc/pihole

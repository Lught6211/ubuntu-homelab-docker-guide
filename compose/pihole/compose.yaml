services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: "Asia/Kuala_Lumpur"
      FTLCONF_LOCAL_IPV4: "${PIHOLE_IPV4:-192.168.0.26}"
    volumes:
      - ./etc-pihole:/etc/pihole

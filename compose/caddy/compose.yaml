services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - homelab_proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  homelab_proxy:
    external: true
    name: homelab_proxy

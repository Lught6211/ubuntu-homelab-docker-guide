services:
  cisco-tailscale:
    image: tailscale/tailscale:v1.92.5
    hostname: cisco-homelab
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in the Portainer stack environment}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_HOSTNAME: cisco-homelab
    volumes:
      - cisco_tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  cisco-docker-guard:
    build:
      context: ../..
      dockerfile: compose/cisco-agent/Dockerfile
    command: ["uvicorn", "app.docker_guard:app", "--host", "127.0.0.1", "--port", "2375"]
    user: "0:0"
    environment:
      CISCO_MANAGED_SERVICES: ${CISCO_MANAGED_SERVICES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: service:cisco-tailscale
    depends_on:
      - cisco-tailscale
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cisco-homelab-agent:
    build:
      context: ../..
      dockerfile: compose/cisco-agent/Dockerfile
    environment:
      CISCO_API_TOKEN: ${CISCO_API_TOKEN:?Set CISCO_API_TOKEN (32+ random characters) in Portainer}
      CISCO_SERVER_LABEL: ${CISCO_SERVER_LABEL:-HOMELAB NODE}
      CISCO_ALLOWED_ORIGINS: ${CISCO_ALLOWED_ORIGINS:-https://project-cisco.vercel.app,http://localhost:3000}
      CISCO_MANAGED_SERVICES: ${CISCO_MANAGED_SERVICES:-}
      CISCO_MONITORED_SITES: ${CISCO_MONITORED_SITES:-[]}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
    network_mode: service:cisco-tailscale
    depends_on:
      - cisco-tailscale
      - cisco-docker-guard
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  cisco_tailscale_state:
